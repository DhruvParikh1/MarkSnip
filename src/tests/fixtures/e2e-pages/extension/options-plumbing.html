<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Options Plumbing Fixture</title>
</head>
<body>
  <main>
    <article>
      <h1>Options Plumbing Fixture</h1>
      <p>This fixture checks that popup clips use the stored site rules and table formatting, the same as every other clip path.</p>
      <table>
        <thead><tr><th>Name</th><th>Link</th></tr></thead>
        <tbody>
          <tr><td>Row one</td><td><a href="https://example.com/a">Example A</a></td></tr>
          <tr><td>Row two</td><td><a href="https://example.com/b">Example B</a></td></tr>
        </tbody>
      </table>
      <p>A closing paragraph keeps the article body long enough for extraction to stay deterministic.</p>
    </article>
  </main>
</body>
</html>
